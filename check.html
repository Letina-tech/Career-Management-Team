<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Career Management Team: server check</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font:16px/1.5 system-ui,Segoe UI,sans-serif;max-width:780px;margin:30px auto;padding:0 16px;color:#16212B}
h1{font-size:26px}h2{font-size:18px;margin-top:28px}li{margin:8px 0;list-style:none}ul{padding:0}
.ok{color:#0a7a3d}.bad{color:#b3261e;font-weight:600}.info{color:#16212B}code{background:#eef1f4;padding:1px 6px;border-radius:4px;word-break:break-all}
</style></head><body>
<h1>Career Management Team: server check</h1>
<p>If something is not working or not displayed, send a screenshot of this whole page.</p>
<h2>On the computer running the server</h2><ul id="s"><li>Checking…</li></ul>
<h2>In this browser</h2><ul id="r"></ul>
<script>
function line(ul, cls, text, hint){
  var li = document.createElement('li'); li.className = cls;
  li.textContent = (cls === 'ok' ? '\u2713 ' : cls === 'bad' ? '\u2717 ' : '') + text + (cls === 'bad' && hint ? ' \u2014 ' + hint : '');
  ul.append(li);
}
var S = document.getElementById('s'), R = document.getElementById('r');
function add(ok, text, hint){ line(R, ok ? 'ok' : 'bad', text, hint); }
(async function(){
  try{
    var i = await (await fetch('/api/info', {cache:'no-store'})).json();
    S.textContent = '';
    line(S,'info','Node version: ' + i.node);
    line(S,'info','Server folder: ' + i.folder);
    line(S,'info','Saved data file: ' + i.data);
    line(S,'info','Saved so far: ' + i.tasks + ' tasks, ' + i.cards + ' cards');
    line(S, i.indexExists ? 'ok' : 'bad', 'public/index.html ' + (i.indexExists ? 'found' : 'NOT found'), 'put the team page here and name it index.html');
    line(S, i.shimExists ? 'ok' : 'bad', 'public/local-shim.js ' + (i.shimExists ? 'found' : 'NOT found'), 'this file must be in the public folder');
    line(S,'info','Address for you: http://localhost:' + i.port);
    line(S,'info','Addresses for teammates on your network: ' + (i.addresses.length ? i.addresses.join('   ') : 'none found (are you connected to a network?)'));
  }catch(e){ S.textContent = ''; line(S,'bad','Could not read the server details','the server may have stopped; start it again'); }

  var html = '';
  try{
    var x = await fetch('/', {cache:'no-store'}); html = await x.text();
    add(x.ok, 'The team page loads from this server (status ' + x.status + ')', 'public/index.html is missing');
  }catch(e){ add(false, 'The team page did not load', 'is the server still running?'); }
  add(html.indexOf('id="view"') > -1, 'The page looks like the team page', 'replace public/index.html with the team page file');
  add(html.indexOf('local-shim.js') > -1 || html.indexOf('Local replacement') > -1, 'Saving support is added to the page', 'public/index.html may be missing or has no script tag');

  var bodies = [], re = /<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi, m;
  while ((m = re.exec(html))) bodies.push(m[1]);
  var err = '';
  bodies.forEach(function(b, n){ try{ new Function(b); }catch(e){ err += 'script ' + (n + 1) + ': ' + e.message + '. '; } });
  add(!err, 'The page code has no errors', err + 'A typo was probably added while editing the page text, such as a missing or extra quote or bracket. Compare with the original index.html.');

  try{
    var y = await fetch('/local-shim.js', {cache:'no-store'}), t = await y.text();
    add(y.ok && t.indexOf('window.claude') > -1, 'local-shim.js is served', 'file missing or changed');
  }catch(e){ add(false, 'local-shim.js did not load'); }
  try{
    var z = await (await fetch('/api/health', {cache:'no-store'})).json();
    add(z.ok, 'The saving service answers (' + z.tasks + ' tasks, ' + z.cards + ' cards)');
  }catch(e){ add(false, 'The saving service did not answer', 'check you are using the address the terminal printed'); }

  var f = document.createElement('iframe');
  f.style.cssText = 'position:absolute;left:-9999px;width:1200px;height:800px;border:0';
  f.src = '/'; document.body.append(f);
  await new Promise(function(res){ f.onload = res; setTimeout(res, 6000); });
  await new Promise(function(res){ setTimeout(res, 3000); });
  try{
    var d = f.contentDocument, v = d.querySelector('#view'), n = v ? v.innerText.trim().length : 0;
    add(n > 100, 'The page draws its content (' + n + ' characters on screen)', 'the page code stopped before drawing, see any error above');
    var chip = d.querySelector('.top .pill');
    add(!!chip, 'The status light is present' + (chip ? ': ' + chip.textContent : ''), 'the page header was changed or the page did not finish loading');
    var logo = d.querySelectorAll('svg.cmt').length;
    add(logo > 0, 'The CMT logo is on the page');
    var nameDlg = d.querySelectorAll('dialog[open]').length;
    if (nameDlg) line(R, 'info', 'Note: the page is asking for your name. Fill it in on the main page.');
  }catch(e){ add(false, 'Could not inspect the page: ' + e.message); }
})();
</script></body></html>
