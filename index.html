<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Career Management Team</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#16212B; --muted:#56636F; --line:#D3DAE1;
  --p1:#0B7A63; --p1s:#DAF0E9; --p2:#5A3DA1; --p2s:#E7E0F6;
  --warn:#8A5200; --warns:#FBEBCF; --info:#1F5FA8; --infos:#DCE9F8; --bad:#B3261E;
  --radius:10px; color-scheme:light;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Public Sans","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11171C; --surface:#1A2229; --ink:#E8EDF1; --muted:#9DAAB5; --line:#2D3943;
    --p1:#46C2A5; --p1s:#17332D; --p2:#AE98F0; --p2s:#2A2345;
    --warn:#F0B35A; --warns:#3A2B12; --info:#7FB2EE; --infos:#162A41; --bad:#F2877F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11171C; --surface:#1A2229; --ink:#E8EDF1; --muted:#9DAAB5; --line:#2D3943;
  --p1:#46C2A5; --p1s:#17332D; --p2:#AE98F0; --p2s:#2A2345;
  --warn:#F0B35A; --warns:#3A2B12; --info:#7FB2EE; --infos:#162A41; --bad:#F2877F; color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--body);min-height:100%}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.15;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--info);outline-offset:2px;border-radius:4px}
.p1{--c:var(--p1);--cs:var(--p1s);--cd:#0B7A63}
.p2{--c:var(--p2);--cs:var(--p2s);--cd:#5A3DA1}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}

.ico{width:44px;height:44px;border-radius:10px;background:var(--cd);display:grid;place-items:center;flex:none}
.ico img{width:26px;height:26px;display:block}
.ico.big{width:60px;height:60px;border-radius:14px}
.ico.big img{width:36px;height:36px}
.ttl{display:flex;align-items:center;gap:12px}
.thl{display:flex;align-items:center;gap:16px}
/* CMT logo */
.cmt{display:block;width:100%;height:auto;overflow:visible}
.cmt *{transform-box:fill-box;transform-origin:50% 50%}
.cmt .lt{transition:transform .25s ease,opacity .25s ease;outline:none;cursor:pointer}
.cmt .hit{fill:transparent;stroke:none}
.cmt .lt:hover,.cmt .lt:focus-visible,.cmt .lt.on{transform:translateY(-6px)}
.cmt:has(.lt:hover) .lt:not(:hover),.cmt:has(.lt:focus-visible) .lt:not(:focus-visible),.cmt.has-on .lt:not(.on){opacity:.4}
.cmt .lt:focus-visible .hit{stroke:var(--info);stroke-width:2;rx:10}
.cmt .f1{fill:var(--p1)} .cmt .f2{fill:var(--p2)} .cmt .fi{fill:var(--ink)}
.cmt .sc{fill:none;stroke:var(--p1);stroke-width:12;stroke-linecap:round}
.cmt .ms{fill:var(--surface);stroke:var(--p1);stroke-width:4.5}
.cmt .ar{fill:var(--p1)}
.cmt .sv{fill:none;stroke:var(--ink);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.cmt .hub{fill:var(--ink)} .cmt .hubd{fill:var(--surface)}
.cmt .pl{transition:transform .25s ease;transform-origin:50% 100%}
.cmt .lt.m:hover .pl.l,.cmt .lt.m.on .pl.l,.cmt .lt.m:focus-visible .pl.l{transform:translateX(-5px)}
.cmt .lt.m:hover .pl.r,.cmt .lt.m.on .pl.r,.cmt .lt.m:focus-visible .pl.r{transform:translateX(5px)}
.cmt .ts{transform-origin:50% 0}
@media (prefers-reduced-motion:no-preference){
  .cmt.anim .sc{stroke-dasharray:100;animation:cdraw .9s ease-out backwards}
  .cmt.anim .ms{animation:pop .4s ease-out backwards}
  .cmt.anim .ms1{animation-delay:.3s} .cmt.anim .ms2{animation-delay:.5s} .cmt.anim .ms3{animation-delay:.7s}
  .cmt.anim .ar{animation:pop .4s .95s ease-out backwards}
  .cmt.anim .pl{animation:rise .6s .3s cubic-bezier(.2,.8,.2,1) backwards}
  .cmt.anim .pl.r{animation-delay:.42s}
  .cmt.anim .sv{stroke-dasharray:100;animation:cdraw .6s .8s ease-out backwards}
  .cmt.anim .hub,.cmt.anim .hubd{animation:pop .4s 1.25s ease-out backwards}
  .cmt.anim .pp{animation:pop .4s ease-out backwards}
  .cmt.anim .p1c{animation-delay:.9s} .cmt.anim .p2c{animation-delay:1s} .cmt.anim .p3c{animation-delay:1.1s}
  .cmt.anim .tb{animation:grow .5s .85s ease-out backwards}
  .cmt.anim .ts{animation:rise .5s 1.2s ease-out backwards}
  .cmt .lt.c:hover .ms,.cmt .lt.c.on .ms,.cmt .lt.c:focus-visible .ms{animation:glow .9s ease-in-out infinite}
  .cmt .lt.c:hover .ms2,.cmt .lt.c.on .ms2,.cmt .lt.c:focus-visible .ms2{animation-delay:.15s}
  .cmt .lt.c:hover .ms3,.cmt .lt.c.on .ms3,.cmt .lt.c:focus-visible .ms3{animation-delay:.3s}
  .cmt .lt.m:hover .hub,.cmt .lt.m.on .hub,.cmt .lt.m:focus-visible .hub{animation:glow .9s ease-in-out infinite}
  .cmt .lt.t:hover .pp,.cmt .lt.t.on .pp,.cmt .lt.t:focus-visible .pp{animation:bob .7s ease-in-out infinite}
  .cmt .lt.t:hover .p2c,.cmt .lt.t.on .p2c,.cmt .lt.t:focus-visible .p2c{animation-delay:.12s}
  .cmt .lt.t:hover .p3c,.cmt .lt.t.on .p3c,.cmt .lt.t:focus-visible .p3c{animation-delay:.24s}
}
@keyframes cdraw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes glow{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.brandlogo{display:block;width:78px;flex:none}
.logohero{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 16px 14px;width:min(360px,100%)}
.legend{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.legend button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:transparent;border-radius:99px;padding:3px 9px 3px 3px;font-weight:500;font-size:13.5px}
.legend button.on,.legend button:hover{border-color:var(--ink);background:var(--bg)}
.legend i{font:700 13px var(--display);font-style:normal;width:26px;height:26px;border-radius:99px;display:grid;place-items:center;color:#fff}
.legend .kc i{background:#0B7A63} .legend .km i{background:var(--ink);color:var(--bg)} .legend .kt i{background:#5A3DA1}
.savebar{display:flex;gap:8px;justify-content:center;margin-top:14px}
.logohero .cap{margin-top:12px;text-align:center;min-height:3.4em}
.logohero .cap b{display:block;font:700 18px var(--display);color:var(--ink)}
.logohero .cap span{color:var(--muted);font-size:13.5px}
/* top bar */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top .wrap{display:flex;align-items:center;gap:20px;min-height:60px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:700 18px/1 var(--display)}
.brand svg{flex:none}
nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;max-width:100%}
nav a{padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap;border-bottom:3px solid transparent;border-radius:8px 8px 0 0}
nav a:hover{color:var(--ink)}
nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--c,var(--ink))}
nav a.n1{--c:var(--p1)} nav a.n2{--c:var(--p2)}

main{padding:28px 0 64px}
.banner{background:var(--warns);color:var(--warn);border:1px solid var(--warn);border-radius:var(--radius);padding:12px 16px;margin-bottom:20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner b{font-weight:600}
.banner .btn{margin-left:auto}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--c,var(--ink));border-color:var(--c,var(--ink));color:var(--surface)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.small{padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.intro{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:24px}
.intro h1{font-size:clamp(30px,5vw,46px);max-width:16ch}
.intro p{color:var(--muted);max-width:52ch;margin-top:10px}

/* pillars on overview */
.pillars{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.pillar{background:var(--surface);border:1px solid var(--line);border-top:8px solid var(--c);border-radius:4px 4px var(--radius) var(--radius);padding:24px;display:flex;flex-direction:column;gap:16px}
.pillar h2{font-size:24px}
.pillar .sub{color:var(--muted)}
.meter{height:8px;background:var(--cs);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--c);border-radius:99px}
.meterline{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}
.minilist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.minilist li{border-bottom:1px solid var(--line)}
.minilist a{display:flex;align-items:center;gap:10px;padding:10px 0;text-decoration:none}
.minilist a:hover .t{text-decoration:underline}
.minilist .t{flex:1;font-weight:500}
.minilist .d{color:var(--muted);font-size:13px;white-space:nowrap}

.cols2{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;margin-top:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.panel h3{font-size:18px;margin-bottom:12px}
.feed{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.feed li{border-left:3px solid var(--c);padding-left:12px}
.feed .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.feed a{font-weight:500}
.empty{color:var(--muted);padding:12px 0}

/* chips + status */
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.s-todo{background:var(--line);color:var(--ink)}
.s-doing{background:var(--warns);color:var(--warn)}
.s-review{background:var(--infos);color:var(--info)}
.s-done{background:var(--ink);color:var(--bg)}
.chip{display:inline-block;background:var(--cs,var(--line));color:var(--ink);border-radius:6px;padding:1px 8px;font-size:13px}
.late{color:var(--bad);font-weight:600}
select.status{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px}

/* pillar page */
.phead{border-top:8px solid var(--c);background:var(--surface);border:1px solid var(--line);border-top:8px solid var(--c);border-radius:4px 4px var(--radius) var(--radius);padding:22px 24px;margin-bottom:20px;display:flex;gap:20px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.phead h1{font-size:clamp(24px,4vw,34px)}
.phead p{color:var(--muted);margin-top:6px}
.tasklist{display:grid;gap:14px}
.taskrow{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:var(--radius);padding:18px 20px;display:grid;grid-template-columns:1fr auto;gap:12px 20px}
.taskrow h3{font-size:19px}
.taskrow .desc{color:var(--muted);margin-top:4px;max-width:70ch}
.taskrow .facts{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:13.5px;color:var(--muted)}
.taskrow .facts b{color:var(--ink);font-weight:600}
.taskrow .side{display:flex;flex-direction:column;align-items:flex-end;gap:10px;justify-content:space-between}
.taskrow .bar{grid-column:1/-1}

/* task workspace */
.back{display:inline-flex;gap:6px;margin-bottom:14px;color:var(--muted);text-decoration:none;font-weight:500}
.back:hover{color:var(--ink)}
.thead{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start;margin-bottom:20px}
.thead .tag{display:inline-block;background:var(--c);color:var(--surface);padding:2px 10px;border-radius:6px;font-size:13px;font-weight:600;margin-bottom:8px}
.thead h1{font-size:clamp(26px,4vw,36px);max-width:26ch}
.thead .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.work{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
.details{display:grid;gap:16px;position:sticky;top:calc(76px + env(safe-area-inset-top,0px))}
.details .panel{padding:16px 18px}
.details h4{font-size:15px;margin-bottom:8px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.checks label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.checks input{margin-top:4px;accent-color:var(--c);width:16px;height:16px;flex:none}
.checks input:checked+span{color:var(--muted);text-decoration:line-through}
.team dt{font-size:13px;color:var(--muted);margin-top:8px}
.team dd{margin:2px 0 0;display:flex;flex-wrap:wrap;gap:6px}
.prompt{background:var(--cs);border-radius:var(--radius);padding:14px 18px;margin-bottom:16px}
.prompt h4{font-size:14px;margin-bottom:4px}
.composer{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:18px}
.kinds{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.kinds button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:3px 12px;font-size:13.5px}
.kinds button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--surface)}
.composer textarea{width:100%;min-height:84px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg)}
.composer .row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px;flex-wrap:wrap}
.composer .hint{font-size:13px;color:var(--muted)}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;align-items:start}
.lane h4{font-size:15px;display:flex;justify-content:space-between;padding:0 2px 8px;border-bottom:3px solid var(--c)}
.lane h4 span{color:var(--muted);font-family:var(--body);font-weight:500;font-size:13px}
.lane .stack{display:grid;gap:10px;margin-top:10px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-wrap:anywhere}
.note p{white-space:pre-wrap}
.note .foot{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.note .foot .sp{flex:1}
.vote{border:1px solid var(--line);background:transparent;border-radius:99px;padding:1px 10px;font-size:13px}
.vote[aria-pressed="true"]{background:var(--cs);border-color:var(--c);color:var(--ink);font-weight:600}
.lane .none{color:var(--muted);font-size:13.5px;padding:6px 2px}

/* timeline */
.gantt{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.g{min-width:760px;padding:16px 20px 20px}
.grow{display:grid;grid-template-columns:280px 1fr;align-items:center;gap:12px;min-height:40px}
.grow .lab{font-size:14px;font-weight:500;text-decoration:none;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow .lab:hover{text-decoration:underline}
.track{position:relative;height:28px;background-image:linear-gradient(var(--line),var(--line));background-size:100% 1px;background-position:0 50%;background-repeat:no-repeat}
.gbw{position:absolute;top:3px;height:22px;cursor:pointer}
.gbw:focus-visible{outline-offset:3px}
.gb{position:absolute;inset:0;border-radius:6px;background:var(--cs);border:1px solid var(--c);overflow:hidden}
.gbw:hover .gb,.gbw:focus-visible .gb{border-width:2px}
.tip{display:none;position:absolute;bottom:calc(100% + 8px);left:0;z-index:10;min-width:220px;max-width:300px;width:max-content;background:var(--ink);color:var(--bg);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.45;box-shadow:0 6px 20px rgba(0,0,0,.25);pointer-events:none}
.gbw.r .tip{left:auto;right:0}
.tip b{display:block;font-weight:600;margin-bottom:4px;font-size:13.5px}
.tip div{display:flex;justify-content:space-between;gap:12px}
.tip div span:first-child{opacity:.75}
.gbw:hover .tip,.gbw:focus-visible .tip{display:block}
.gb i{position:absolute;inset:0 auto 0 0;background:var(--c);opacity:.85}
.ghead{position:relative;height:24px;font-size:12.5px;color:var(--muted)}
.ghead span{position:absolute;top:0;transform:translateX(-1px);padding-left:4px;border-left:1px solid var(--line);height:100%}
.gtoday{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:2}
.gtoday.first::after{content:"Today";position:absolute;top:-18px;left:-16px;font-size:11.5px;color:var(--bad);font-weight:600}
.gpil{font:700 15px var(--display);margin:14px 0 2px;padding-bottom:6px;border-bottom:3px solid var(--c)}
.gwrap{position:relative}

/* dialog */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
dialog::backdrop{background:rgba(10,16,20,.55)}
dialog form{padding:22px;display:grid;gap:14px;max-height:calc(100vh - 24px);overflow:auto}
dialog h2{font-size:22px}
label.f{display:grid;gap:4px;font-weight:500;font-size:14px}
label.f small{color:var(--muted);font-weight:400}
label.f input,label.f textarea,label.f select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);font-weight:400;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dacts{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.dacts div{display:flex;gap:8px}
.err{color:var(--bad);font-size:14px;min-height:1em}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:50;max-width:90vw}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:960px){
  .work{grid-template-columns:1fr}
  .work>section{order:-1}
  .details{position:static}
  .cols2{grid-template-columns:1fr}
}
@media (max-width:720px){
  .pillars{grid-template-columns:1fr}
  .taskrow{grid-template-columns:1fr}
  .taskrow .side{flex-direction:row;align-items:center;justify-content:space-between}
  .two{grid-template-columns:1fr}
  nav{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:no-preference){
  .meter i,.gb i{transition:width .4s ease}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#/" aria-label="Career Management Team, home">
      <span id="brandlogo" class="brandlogo"></span>
      Career Management Team
    </a>
    <nav id="nav" aria-label="Sections"></nav>
  </div>
</header>
<main><div class="wrap" id="view"></div></main>
<dialog id="dlg"></dialog>
<div id="toast" class="toast" role="status" hidden></div>

<script>
"use strict";
/* ---------- constants ---------- */
const PILLARS = {
  1: {n:1, cls:'p1', name:'Career Management & Growth Pathway', short:'Growth Pathway',
      blurb:'Show every employee where they can go next and what it takes to get there.'},
  2: {n:2, cls:'p2', name:'Succession Planning & Leadership Pipeline', short:'Leadership Pipeline',
      blurb:'Make sure every critical role has ready successors and a leadership bench that keeps growing.'}

const LOGO_WORDS = {
  c:['Career','Pathways that show every employee where to grow next.'],
  m:['Management','Strategy, governance and succession, steered from the centre.'],
  t:['Team','Leaders and contributors building it together.']

function logoSvg(uid, interactive){
  const g='cmtg'+uid;
  const L=(k,label,body,hit)=>`<g class="lt ${k}" data-k="${k}"${interactive?` tabindex="0" role="img" aria-label="${label}"`:''}><rect class="hit" ${hit}/>${body}</g>`;
  const person=(cx,cls,n)=>`<g class="pp p${n}c"><circle class="${cls}" cx="${cx}" cy="18.5" r="6.5"/><path class="${cls}" d="M${cx-10} 42 v-6 a10 10 0 0 1 20 0 v6 z"/></g>`;
  const cap=(x,y,c)=>`<rect class="${c}" x="${x}" y="${y}" width="20" height="6" rx="2"/>`;
  return `<svg class="cmt" viewBox="0 0 240 100" xmlns="http://www.w3.org/2000/svg"${interactive?' role="group" aria-label="CMT logo: C is Career, M is Management, T is Team"':' aria-hidden="true" focusable="false"'}>
  <defs><linearGradient id="${g}" x1="0" x2="1" y1="0" y2="0"><stop offset="0" style="stop-color:var(--p1)"/><stop offset="1" style="stop-color:var(--p2)"/></linearGradient></defs>
  ${L('c','C, Career',`<path class="sc" pathLength="100" d="M65.2 69.7 A32 32 0 1 1 65.2 30.3"/><circle class="ms ms1" cx="24" cy="77.7" r="8"/><circle class="ms ms2" cx="8" cy="50" r="8"/><circle class="ms ms3" cx="24" cy="22.3" r="8"/><polygon class="ar" points="79,17 63.4,22 74,32.6"/>`,'x="-4" y="8" width="84" height="84"')}
  ${L('m','M, Management',`<g class="pl l">${cap(83,14,'f1')}<rect class="f1" x="86" y="18" width="14" height="64" rx="2"/>${cap(83,80,'f1')}</g><g class="pl r">${cap(143,14,'f2')}<rect class="f2" x="146" y="18" width="14" height="64" rx="2"/>${cap(143,80,'f2')}</g><path class="sv" pathLength="100" d="M95 28 L123 60 L151 28"/><circle class="hub" cx="123" cy="62" r="10"/><circle class="hubd" cx="123" cy="62" r="3.8"/>`,'x="80" y="8" width="88" height="84"')}
  ${L('t','T, Team',`${person(186,'f1',1)}${person(208,'fi',2)}${person(230,'f2',3)}<rect class="tb" fill="url(#${g})" x="176" y="42" width="64" height="6" rx="3"/><rect class="ts fi" x="201" y="48" width="14" height="34" rx="3"/>`,'x="172" y="8" width="70" height="84"')}
</svg>`;
}

  const P1='#0B7A63',P2='#5A3DA1',INK='#16212B';

<circle cx="123" cy="62" r="10" fill="${INK}"/><circle cx="123" cy="62" r="3.8" fill="#FFFFFF"/>
${person(186,P1)}${person(208,INK)}${person(230,P2)}

</svg>`;

async function saveLogo(kind){
  if(!S.dl) return;
  const svg=logoFile();
  try{
    if(kind==='svg'){ await S.dl.save({filename:'cmt-logo.svg',data:svg}); return; }
    const img=new Image();
    await new Promise((ok,bad)=>{ img.onload=ok; img.onerror=bad; img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg); });
    const c=document.createElement('canvas'); c.width=1280; c.height=460;
    c.getContext('2d').drawImage(img,0,0,1280,460);
    const blob=await new Promise(r=>c.toBlob(r,'image/png'));
    await S.dl.save({filename:'cmt-logo.png',data:blob});
  }catch(e){ if(!e||e.code!=='declined') toast("The logo didn't save. Try again."); }
}
function replayLogo(svg){
  svg.classList.remove('anim'); void svg.getBoundingClientRect(); svg.classList.add('anim');
  clearTimeout(svg._t); svg._t=setTimeout(()=>svg.classList.remove('anim'),2600);
}
let HERO=null;
function logoHero(){
  if(HERO) return HERO;

  HERO.innerHTML=logoSvg('hero',true)+
    '<div class="legend" role="group" aria-label="What the letters stand for">'+
    ['c','m','t'].map(k=>`<button type="button" class="k${k}" data-k="${k}"><i>${k.toUpperCase()}</i>${LOGO_WORDS[k][0]}</button>`).join('')+
    '</div><div class="savebar" hidden><button type="button" class="btn small" data-save="svg">Save logo (SVG)</button><button type="button" class="btn small" data-save="png">Save logo (PNG)</button></div><p class="cap" aria-live="polite"><b></b><span></span></p>';
  HERO.querySelectorAll('[data-save]').forEach(x=>x.addEventListener('click',e=>{e.stopPropagation();saveLogo(x.dataset.save);}));
  HERO.querySelector('.savebar').hidden=!S.dl;
  const svg=HERO.querySelector('svg'), b=HERO.querySelector('.cap b'), sp=HERO.querySelector('.cap span');
  const show=k=>{
    if(k&&LOGO_WORDS[k]){ b.textContent=LOGO_WORDS[k][0]; sp.textContent=LOGO_WORDS[k][1]; }
    else { b.textContent='Career Management Team'; sp.textContent='Hover or tap a letter. Click the logo to replay.'; }
    svg.classList.toggle('has-on',!!k);
    svg.querySelectorAll('.lt').forEach(g=>g.classList.toggle('on',g.dataset.k===k));
    HERO.querySelectorAll('.legend button').forEach(x=>x.classList.toggle('on',x.dataset.k===k));
  };
  show(null);
  const key=e=>{const t=e.target.closest&&e.target.closest('[data-k]');return t?t.dataset.k:null;};
  HERO.addEventListener('mouseover',e=>show(key(e)));
  HERO.addEventListener('mouseleave',()=>show(null));
  HERO.addEventListener('focusin',e=>show(key(e)));
  HERO.addEventListener('focusout',()=>show(null));
  svg.addEventListener('click',()=>replayLogo(svg));
  svg.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();replayLogo(svg);} });
  replayLogo(svg);
  return HERO;
}

/* ---------- helpers ---------- */
function h(tag, attrs, ...kids){
  const e = document.createElement(tag), late = [];
  for (const [k,v] of Object.entries(attrs||{})){
    if (v==null || v===false) continue;
    if (k==='class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k==='value' || k==='checked' || k==='disabled') late.push([k,v]);
    else e.setAttribute(k, v===true ? '' : v);
  }
  for (const c of kids.flat(Infinity)){
    if (c==null || c===false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  for (const [k,v] of late) e[k] = v;
  return e;
}
const $ = s => document.querySelector(s);
const today0 = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const pd = s => { const [y,m,d] = String(s||'').split('-').map(Number); return new Date(y,(m||1)-1,d||1); };
const fmt = s => s ? pd(s).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}) : 'No date';
const fmtShort = s => s ? pd(s).toLocaleDateString(undefined,{day:'numeric',month:'short'}) : '';
const dayDiff = (a,b) => Math.round((a-b)/86400000);
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.hidden=false;
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,3500);
}
function ago(ms){
  const s=(Date.now()-ms)/1000;
  if (s<60) return 'just now';
  if (s<3600) return Math.floor(s/60)+' min ago';
  if (s<86400) return Math.floor(s/3600)+' h ago';
  if (s<86400*7) return Math.floor(s/86400)+' d ago';
  return new Date(ms).toLocaleDateString(undefined,{day:'numeric',month:'short'});
}
function personName(id){
  if (!id) return 'Team member';
  if (id===S.uid) return 'You';
  const p=S.people[id]; return (p && p.name) || 'Team member';
}

/* ---------- data access ---------- */
function usingStarter(){ return !S.db || (S.tasksLoaded && S.tasks.length===0); }
function allTasks(){
  let list = [];
  if (S.tasksLoaded && S.tasks.length) list = S.tasks;
  else if (usingStarter()) list = STARTER;
  return list.map(t=>({
    ...t,
    deliverables:(t.deliverables||[]).map(d=>typeof d==='string'?{t:d,done:false}:d),
    contributors:t.contributors||[], status:STATUS[t.status]?t.status:'todo'
  })).sort((a,b)=>(a.start||'9999').localeCompare(b.start||'9999')||a.title.localeCompare(b.title));
}
const tasksOf = n => allTasks().filter(t=>t.pillar===n);
const taskById = id => allTasks().find(t=>t.id===id);
const cardsOf = id => S.cards.filter(c=>c.taskId===id);
const votesOf = c => Object.values(c.votes||{}).filter(Boolean).length;
function pct(t){
  if (t.status==='done') return 1;
  const d=t.deliverables; if(!d.length) return 0;
  return d.filter(x=>x.done).length/d.length;
}
function pillarPct(n){
  const ts=tasksOf(n); if(!ts.length) return 0;
  return ts.reduce((a,t)=>a+pct(t),0)/ts.length;
}
const span = t => t.ongoing||!t.start ? 'Ongoing, no fixed end date' : fmt(t.start)+' to '+fmt(t.end);
function dueText(t){
  if (t.status==='done') return {text:'Completed',late:false};
  if (t.ongoing||!t.end) return {text:'Ongoing',late:false};
  const d=dayDiff(pd(t.end),today0());
  if (d<0) return {text:Math.abs(d)+' d overdue',late:true};
  if (d===0) return {text:'Due today',late:false};
  if (d<=30) return {text:'Due in '+d+' d',late:false};
  return {text:'Due '+fmtShort(t.end),late:false};
}

async function guard(fn){
  try { await fn(); }
  catch(e){
    console.error(e);
    toast(e && e.code==='quota_exceeded' ? 'Storage is full. Delete some cards first.' : "That didn't save. Check your access and try again.");
  }
}
const setStatus = (t,status) => guard(()=>S.db.doc('tasks/'+t.id).update({status}));
function toggleDeliverable(t,i,done){
  const deliverables=t.deliverables.map((d,j)=>j===i?{...d,done}:d);
  return guard(()=>S.db.doc('tasks/'+t.id).update({deliverables}));
}
function addCard(taskId){
  const text=S.draft.trim(); if(!text) return;
  const id='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const body={taskId,kind:S.kind,text:text.slice(0,2000),author:S.uid||null,at:Date.now(),votes:{}};
  S.draft='';
  return guard(()=>S.db.doc('cards/'+id).set(body));
}
function vote(c){
  if(!S.uid){ toast('Votes need a signed-in account.'); return; }
  const on=!(c.votes&&c.votes[S.uid]);
  return guard(()=>S.db.doc('cards/'+c.id).update({votes:{[S.uid]:on}}));
}
function removeCard(c){
  if (S.armed!==c.id){ S.armed=c.id; render(); setTimeout(()=>{ if(S.armed===c.id){S.armed=null;render();} },4000); return; }
  S.armed=null;
  return guard(()=>S.db.doc('cards/'+c.id).delete());
}

function editTask(t, pillar){
  const dlg=$('#dlg'), isNew=!t;
  t = t || {pillar:pillar||1,title:'',description:'',prompt:'',deliverables:[],start:'',end:'',leader:'',contributors:[],status:'todo'};
  const err=h('p',{class:'err',role:'alert'});
  const f={
    title:h('input',{required:true,value:t.title,maxlength:'120'}),
    pillar:h('select',{value:String(t.pillar)},[1,2].map(n=>h('option',{value:String(n)},PILLARS[n].name))),
    description:h('textarea',{rows:'3',value:t.description}),
    prompt:h('textarea',{rows:'2',value:t.prompt||''}),
    deliverables:h('textarea',{rows:'4',value:t.deliverables.map(d=>d.t).join('\n')}),
    start:h('input',{type:'date',value:t.start}),
    end:h('input',{type:'date',value:t.end}),
    leader:h('input',{value:t.leader||'',maxlength:'80'}),
    contributors:h('input',{value:t.contributors.join(', ')}),
    icon:h('select',{value:String(t.icon||'')},h('option',{value:''},'No icon'),
      h('optgroup',{label:'Growth Pathway set'},ICON_NAMES.slice(0,6).map((n,i)=>h('option',{value:String(i+1)},n))),
      h('optgroup',{label:'Leadership Pipeline set'},ICON_NAMES.slice(6).map((n,i)=>h('option',{value:String(i+7)},n)))),
    ongoing:h('input',{type:'checkbox',checked:!!t.ongoing,style:'width:auto'})
  };
  const L=(label,el,hint)=>h('label',{class:'f'},label,hint&&h('small',{},hint),el);
  const form=h('form',{method:'dialog',onsubmit:async e=>{
    e.preventDefault();
    const title=f.title.value.trim();
    if(!title){err.textContent='Add a task title.';return;}
    if(!f.ongoing.checked&&f.start.value&&f.end.value&&f.end.value<f.start.value){err.textContent='The end date must be on or after the start date.';return;}
    const old=Object.fromEntries(t.deliverables.map(d=>[d.t,d.done]));
    const body={
      pillar:Number(f.pillar.value), title, description:f.description.value.trim(), prompt:f.prompt.value.trim(),
      deliverables:f.deliverables.value.split('\n').map(s=>s.trim()).filter(Boolean).map(s=>({t:s,done:!!old[s]})),
      icon:f.icon.value, ongoing:f.ongoing.checked, start:f.ongoing.checked?'':f.start.value, end:f.ongoing.checked?'':(f.end.value||f.start.value), leader:f.leader.value.trim(),
      contributors:f.contributors.value.split(',').map(s=>s.trim()).filter(Boolean),
      status:t.status||'todo'
    };
    const id=isNew?'t'+Date.now().toString(36):t.id;
    await guard(()=>S.db.doc('tasks/'+id).set(body));
    dlg.close();
  }},
    h('h2',{},isNew?'Add task':'Edit task'),
    L('Task title',f.title),
    L('Pillar',f.pillar),
    L('Icon',f.icon),
    L('Description',f.description),
    L('Deliverables',f.deliverables,'One per line. Ticked items stay ticked if the wording is unchanged.'),
    h('div',{class:'two'},L('Start date',f.start),L('End date',f.end)),
    h('label',{class:'f',style:'display:flex;gap:8px;align-items:center'},f.ongoing,'Ongoing task with no fixed dates'),
    h('div',{class:'two'},L('Leader',f.leader),L('Contributors',f.contributors,'Separate names with commas.')),
    L('Question for the team',f.prompt,'Shown above the brainstorm board.'),
    err,
    h('div',{class:'dacts'},
      h('div',{},!isNew&&h('button',{type:'button',class:'btn',style:'color:var(--bad)',onclick:async()=>{
        if(!dlg.dataset.del){dlg.dataset.del='1';e2.textContent='Confirm delete';return;}
        await guard(()=>S.db.doc('tasks/'+t.id).delete());
        for(const c of cardsOf(t.id)) await guard(()=>S.db.doc('cards/'+c.id).delete());
        dlg.close(); location.hash='#/p/'+t.pillar;
      }},'Delete task')),
      h('div',{},h('button',{type:'button',class:'btn',onclick:()=>dlg.close()},'Cancel'),h('button',{type:'submit',class:'btn primary'},'Save task'))));
  const e2=form.querySelector('button[style*="--bad"]');
  delete dlg.dataset.del;
  dlg.replaceChildren(form);
  dlg.showModal();
  f.title.focus();
}

/* ---------- export ---------- */
async function exportMd(){
  const dl=await window.claude?.use('downloads').catch?.(()=>null);
  let out='# Career Management Team: team responses\n\n';
  [1,2].forEach(n=>{
    out+='## '+PILLARS[n].name+'\n\n';
    tasksOf(n).forEach(t=>{
      out+='### '+t.title+'\n\n';
      out+='- Timeline: '+span(t)+'\n- Status: '+STATUS[t.status]+'\n- Leader: '+(t.leader||'Not assigned')+'\n- Contributors: '+(t.contributors.join(', ')||'Not assigned')+'\n\n';
      if(t.description) out+=t.description+'\n\n';
      if(t.deliverables.length){ out+='Deliverables:\n'+t.deliverables.map(d=>'- ['+(d.done?'x':' ')+'] '+d.t).join('\n')+'\n\n'; }
      const cs=cardsOf(t.id);
      if(!cs.length) out+='_No responses yet._\n\n';
      Object.entries(KINDS).forEach(([k,label])=>{
        const items=cs.filter(c=>c.kind===k).sort((a,b)=>votesOf(b)-votesOf(a));
        if(!items.length) return;
        out+='**'+label+'**\n\n'+items.map(c=>'- '+c.text.replace(/\n+/g,' ')+' ('+personName(c.author)+', '+votesOf(c)+' votes)').join('\n')+'\n\n';
      });
    });
  });
  if(!dl){ toast('Export is not available in this view.'); return; }
  try{ await dl.save({filename:'career-management-team-responses.md',data:out}); }
  catch(e){ if(!e||e.code!=='declined') toast("The export didn't save. Try again."); }
}

/* ---------- router ---------- */
function route(){
  const m=(location.hash||'#/').slice(2).split('/');
  if(m[0]==='p'&&PILLARS[m[1]]) return {name:'pillar',n:Number(m[1])};
  if(m[0]==='t'&&m[1]) return {name:'task',id:m[1]};
  if(m[0]==='timeline') return {name:'timeline'};
  return {name:'home'};
}
function renderNav(r){
  const cur=(name,test)=>test?'page':null;
  $('#nav').replaceChildren(
    h('a',{href:'#/','aria-current':cur(0,r.name==='home')},'Overview'),
    h('a',{class:'n1',href:'#/p/1','aria-current':cur(0,(r.name==='pillar'&&r.n===1)||(r.name==='task'&&taskById(r.id)?.pillar===1))},'Growth Pathway'),
    h('a',{class:'n2',href:'#/p/2','aria-current':cur(0,(r.name==='pillar'&&r.n===2)||(r.name==='task'&&taskById(r.id)?.pillar===2))},'Leadership Pipeline'),
    h('a',{href:'#/timeline','aria-current':cur(0,r.name==='timeline')},'Timeline'));
}
let lastKey='';
function render(){
  const r=route(), a=document.activeElement;
  const keep=a&&a.id==='draft'?{s:a.selectionStart,e:a.selectionEnd}:null;
  const view=$('#view'), y=window.scrollY;
  const b=banner();
  const body = r.name==='pillar'?pillarView(r.n) : r.name==='task'?taskView(r.id) : r.name==='timeline'?timelineView() : overview();
  view.replaceChildren(...[b,body].filter(Boolean));
  renderNav(r);
  const key=location.hash;
  if(key!==lastKey){ window.scrollTo(0,0); lastKey=key; document.title=(r.name==='task'&&taskById(r.id)?taskById(r.id).title+' · ':'')+'Career Management Team'; }
  else window.scrollTo(0,y);
  if(keep){ const d=$('#draft'); if(d){ d.focus(); try{d.setSelectionRange(keep.s,keep.e);}catch(_){} } }
}
window.addEventListener('hashchange',render);

/* ---------- boot ---------- */
async function loadPeople(){
  if(!S.user) return;
  const ids=[...new Set(S.cards.map(c=>c.author).filter(x=>x&&!S.people[x]))];
  if(!ids.length) return;
  try{ Object.assign(S.people, await S.user.profiles(ids)); render(); }catch(_){}
}
async function init(){
  const c=window.claude;
  if(!c||!c.use){ S.reason='nofile'; S.booted=true; render(); return; }
  try{ S.user=await c.use('user'); }catch(_){}
  try{ S.db=await c.use('db'); }catch(_){}
  try{ S.dl=await c.use('downloads'); }catch(_){}
  if(HERO&&S.dl) HERO.querySelector('.savebar').hidden=false;
  if(S.user){
    S.uid=await S.user.id();
    S.isEditor=(await S.user.canEdit())||(await S.user.isOwner());
  }
  if(!S.db){
    try{ S.perm=await c.use('permissions'); if(S.perm) S.permState=await S.perm.state(); }catch(_){}
    S.booted=true; render(); return;
  }
  const cw=S.user?await S.user.can('data.write'):null;
  S.canWrite=cw!==false;
  S.booted=true;
  render();
  S.db.collection('tasks').onSnapshot(snap=>{
    S.tasks=snap.docs.map(d=>({id:d.id,...d.data()})); S.tasksLoaded=true; render();
  },e=>{S.dbError=e.code;render();});
  S.db.collection('cards').onSnapshot(snap=>{
    S.cards=snap.docs.map(d=>({id:d.id,...d.data()})); S.cardsLoaded=true; render(); loadPeople();
  },e=>{S.dbError=e.code;render();});
}
{ const bl=$('#brandlogo'); bl.innerHTML=logoSvg('brand',false); const sv=bl.querySelector('svg'); replayLogo(sv); }
render();
init();
</script>
